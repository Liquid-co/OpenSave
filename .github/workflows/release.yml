name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to publish a GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    # Expose whether a signing cert secret is configured (secrets can't be
    # read directly in step `if:`, so map it to job-level env here).
    env:
      HAS_SIGNING: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      # NSIS ships on the runner image but is not on PATH; without makensis
      # `wails build -nsis` silently skips the installer.
      - name: Ensure NSIS (makensis) is on PATH
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS:/c/Program Files (x86)/NSIS/Bin"
          # chocolatey.org has intermittent 503s — retry, and fail THIS step
          # if makensis still isn't available (a late "installer missing"
          # failure after a full build wastes the whole job).
          for attempt in 1 2 3; do
            command -v makensis >/dev/null 2>&1 && break
            choco install nsis -y --no-progress && break
            echo "choco install nsis failed (attempt $attempt); retrying in 30s"
            sleep 30
          done
          if ! command -v makensis >/dev/null 2>&1; then
            echo "::error::makensis unavailable after 3 install attempts"
            exit 1
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          echo 'C:\Program Files (x86)\NSIS\Bin' >> "$GITHUB_PATH"
      - name: Build Windows app (NSIS installer + portable exe)
        working-directory: cmd/opensave-app
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          # The installer shows this rather than wails.json's plain 2.4.0,
          # which cannot carry the -beta suffix (see project.nsi).
          export OPENSAVE_VERSION="$V"
          wails build -nsis -ldflags "-X github.com/opensave/opensave/internal/version.Version=$V -X github.com/opensave/opensave/internal/version.BuildTime=$(date +%s)"
      # Stamped with the same version and build time as the app.
      #
      # These were built with "-s -w" alone, so they carried whatever was
      # hardcoded in internal/version and no build time at all. On a final
      # release that value matches the tag, which is why it went unnoticed;
      # on v2.3.0-beta.1 the published CLI reported itself as 2.3.0. A CLI
      # that does not know it is a pre-release is not offered later betas,
      # and is never offered the final either, since the version it claims
      # is the one being released.
      #
      # The missing BuildTime matters separately: two peers on the SAME
      # version decide whose binary is newer by comparing it.
      - name: Build CLI + relay
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          LD="-s -w -X github.com/opensave/opensave/internal/version.Version=$V -X github.com/opensave/opensave/internal/version.BuildTime=$(date +%s)"
          go build -ldflags="$LD" -o dist/opensave-cli.exe ./cmd/opensave-cli
          go build -ldflags="$LD" -o dist/opensave-relay.exe ./cmd/opensave-relay

      # Fail loudly if the NSIS installer was skipped, and give it a stable
      # download name (the website's download buttons look for "Setup").
      - name: Verify + rename installer
        shell: bash
        run: |
          ls -la cmd/opensave-app/build/bin/
          shopt -s nullglob
          inst=(cmd/opensave-app/build/bin/*installer*.exe)
          if [ ${#inst[@]} -eq 0 ]; then
            echo "::error::NSIS installer was not produced by wails build"
            exit 1
          fi
          size=$(stat -c%s "${inst[0]}")
          if [ "$size" -lt 5000000 ]; then
            echo "::error::installer is only $size bytes — payload missing"
            exit 1
          fi
          mv "${inst[0]}" cmd/opensave-app/build/bin/OpenSave.Setup.exe

      # Wails 2.12 doesn't reliably embed Windows versioninfo, so stamp it
      # onto the built binaries with rcedit (what electron-builder uses).
      - name: Stamp version metadata (rcedit)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Windows file-versions must be numeric (x.y.z.w) — strip any
          # semver pre-release suffix ("2.1.0-beta.1" -> "2.1.0.0").
          FV="${V%%-*}.0"
          # the npm "rcedit" package is a library with no CLI — fetch the real binary
          curl -sL --retry 3 -o "$RUNNER_TEMP/rcedit.exe" \
            https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          for exe in cmd/opensave-app/build/bin/*.exe; do
            # never touch the NSIS installer: rcedit strips the PE overlay
            # holding the compressed payload, leaving a 50 KB stub
            case "$exe" in *Setup*|*installer*) continue ;; esac
            "$RUNNER_TEMP/rcedit.exe" "$exe" \
              --set-version-string "ProductName" "OpenSave" \
              --set-version-string "CompanyName" "OpenSave" \
              --set-version-string "FileDescription" "OpenSave — peer-to-peer game save sync" \
              --set-version-string "LegalCopyright" "Copyright (c) 2026 Siva Prakash & OpenSave contributors" \
              --set-file-version "$FV" \
              --set-product-version "$V" \
              --set-icon "cmd/opensave-app/build/windows/icon.ico"
          done

      # Optional Authenticode signing — runs only when the repo has a
      # WINDOWS_CERT_BASE64 (+ WINDOWS_CERT_PASSWORD) secret configured.
      - name: Code sign (optional)
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WIN_CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WIN_CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          Get-ChildItem cmd/opensave-app/build/bin/*.exe | ForEach-Object {
            & $signtool sign /f $pfx /p $env:WIN_CERT_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            cmd/opensave-app/build/bin/*
            dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails + GTK/WebKit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build Linux app
        working-directory: cmd/opensave-app
        run: |
          V="${GITHUB_REF_NAME#v}"
          wails build -tags webkit2_41 -ldflags "-X github.com/opensave/opensave/internal/version.Version=$V -X github.com/opensave/opensave/internal/version.BuildTime=$(date +%s)"
      - name: Build CLI + relay, assemble tar.gz
        run: |
          # Same stamping as the app; see the Windows job for why.
          V="${GITHUB_REF_NAME#v}"
          LD="-s -w -X github.com/opensave/opensave/internal/version.Version=$V -X github.com/opensave/opensave/internal/version.BuildTime=$(date +%s)"
          go build -ldflags="$LD" -o dist/opensave-cli ./cmd/opensave-cli
          go build -ldflags="$LD" -o dist/opensave-relay ./cmd/opensave-relay
          mkdir -p opensave-linux
          cp cmd/opensave-app/build/bin/OpenSave opensave-linux/opensave
          cp dist/opensave-cli dist/opensave-relay opensave-linux/
          # Desktop integration: launcher entry, icon, and a one-line installer.
          cp cmd/opensave-app/build/linux/opensave.desktop opensave-linux/
          cp cmd/opensave-app/build/linux/install-desktop.sh opensave-linux/
          cp cmd/opensave-app/build/appicon.png opensave-linux/opensave.png
          chmod +x opensave-linux/install-desktop.sh
          # Man page and shell completions, so a CLI install is a complete one.
          mkdir -p opensave-linux/man opensave-linux/completions
          cp packaging/man/opensave.1 opensave-linux/man/
          ./dist/opensave-cli completion bash > opensave-linux/completions/opensave.bash
          ./dist/opensave-cli completion zsh  > opensave-linux/completions/_opensave
          ./dist/opensave-cli completion fish > opensave-linux/completions/opensave.fish
          tar -czf opensave-linux-amd64.tar.gz opensave-linux

          # arm64 CLI + relay, for a Raspberry Pi or ARM NAS acting as an
          # always-on peer. No desktop app: the Wails build needs native
          # WebKit, so this is the headless pair only (pure Go, cross-compiles
          # cleanly with CGO off).
          mkdir -p opensave-linux-arm64
          CGO_ENABLED=0 GOARCH=arm64 go build -ldflags="$LD" \
            -o opensave-linux-arm64/opensave-cli ./cmd/opensave-cli
          CGO_ENABLED=0 GOARCH=arm64 go build -ldflags="$LD" \
            -o opensave-linux-arm64/opensave-relay ./cmd/opensave-relay
          cp packaging/man/opensave.1 opensave-linux-arm64/ 2>/dev/null || true
          tar -czf opensave-linux-arm64.tar.gz opensave-linux-arm64

      # Native packages, so `apt install ./opensave.deb` pulls the WebKitGTK
      # runtime instead of the app installing and then failing to launch.
      - name: Build .deb and .rpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist/completions
          cp cmd/opensave-app/build/bin/OpenSave dist/opensave
          ./dist/opensave-cli completion bash > dist/completions/opensave.bash
          ./dist/opensave-cli completion zsh  > dist/completions/_opensave
          ./dist/opensave-cli completion fish > dist/completions/opensave.fish

          ARCH=amd64 VERSION="$V" nfpm package -f packaging/nfpm.yaml -p deb -t .
          ARCH=amd64 VERSION="$V" nfpm package -f packaging/nfpm.yaml -p rpm -t .
          ls -la ./*.deb ./*.rpm

      # The Decky plugin shipped nowhere: the only documented way to get it was
      # to clone the repo, run npm on a dev machine and scp four files to the
      # Deck. Package it here so a Deck user can unzip it into
      # ~/homebrew/plugins and be done.
      - name: Build the Decky plugin
        working-directory: opensave-decky-plugin
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.js || { echo "::error::plugin build produced no dist/index.js"; exit 1; }
      - name: Package the Decky plugin
        run: |
          # Exactly what Decky loads — node_modules, src and the source map
          # are not part of an installed plugin.
          mkdir -p decky-pkg/OpenSave/dist
          cp opensave-decky-plugin/plugin.json  decky-pkg/OpenSave/
          cp opensave-decky-plugin/package.json decky-pkg/OpenSave/
          cp opensave-decky-plugin/main.py      decky-pkg/OpenSave/
          cp opensave-decky-plugin/dist/index.js decky-pkg/OpenSave/dist/
          (cd decky-pkg && zip -r ../OpenSave-decky-plugin.zip OpenSave)
          unzip -l OpenSave-decky-plugin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            opensave-linux-amd64.tar.gz
            opensave-linux-arm64.tar.gz
            *.deb
            *.rpm
            OpenSave-decky-plugin.zip

  # Flatpak bundle: the only install that works on a stock Steam Deck.
  # SteamOS ships no WebKitGTK and wipes pacman installs on OS updates; the
  # GNOME runtime provides libwebkit2gtk-4.1 (exactly what -tags webkit2_41
  # links), so the flatpak runs untouched across SteamOS updates.
  flatpak:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - name: Install flatpak-builder + GNOME runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder imagemagick
          # ubuntu-24.04 restricts unprivileged user namespaces, which
          # breaks bwrap (flatpak's sandbox) — relax it for this job.
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Keep in sync with runtime-version in packaging/flatpak/*.yml.
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Stage prebuilt binaries
        run: |
          V="${GITHUB_REF_NAME#v}"
          tar -xzf linux/opensave-linux-amd64.tar.gz
          mkdir -p packaging/flatpak/stage
          cp opensave-linux/opensave opensave-linux/opensave-cli \
             opensave-linux/opensave.desktop \
             packaging/flatpak/stage/
          # Flatpak export rejects icons over 512x512; the appicon is 1024.
          convert opensave-linux/opensave.png -resize 512x512 packaging/flatpak/stage/opensave.png
          sed "s/__VERSION__/$V/; s/__DATE__/$(date +%F)/" \
            packaging/flatpak/io.github.sivadaboi.OpenSave.metainfo.xml \
            > packaging/flatpak/stage/io.github.sivadaboi.OpenSave.metainfo.xml
      - name: Build bundle
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            flatpak-build packaging/flatpak/io.github.sivadaboi.OpenSave.yml
          flatpak build-bundle flatpak-repo OpenSave.flatpak io.github.sivadaboi.OpenSave
      - name: Smoke test (every linked library must resolve in the sandbox)
        run: |
          flatpak install --user -y --noninteractive ./OpenSave.flatpak
          flatpak run --command=sh io.github.sivadaboi.OpenSave -c 'ldd /app/bin/opensave' | tee ldd.out
          if grep -q "not found" ldd.out; then
            echo "::error::unresolved libraries inside the flatpak sandbox"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: OpenSave.flatpak

  # macOS is built on macOS because it has to be: Wails links against the
  # system WebKit through cgo, so the app cannot be cross-compiled from Linux
  # the way the headless binaries can. The CLI and relay are pure Go and would
  # cross-compile fine, but they are built here anyway so every macOS artifact
  # comes out of one job with one version stamp.
  #
  # Nothing here is signed with a Developer ID or notarised: that needs a paid
  # Apple Developer account. Everything IS signed ad hoc (codesign --sign -),
  # which costs nothing and decides how macOS treats a download:
  #
  #   - Signed ad hoc, macOS says it cannot verify the developer, and the
  #     person can allow it: System Settings > Privacy & Security > Open
  #     Anyway (on macOS 14 and earlier, right-click > Open also works).
  #   - Not signed as a bundle, macOS says the app "is damaged and can't be
  #     opened" and offers only the Trash, with nothing to allow. That is what
  #     2.4.0-beta.2 shipped: wails builds each architecture, joins them with
  #     lipo and assembles the .app, and nothing ever sealed the result.
  #
  # Adding a Developer ID later means adding credentials to the signing step
  # and a notarisation step after it, not restructuring the job.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build the app (universal)
        working-directory: cmd/opensave-app
        run: |
          V="${GITHUB_REF_NAME#v}"
          STAMP="-X github.com/opensave/opensave/internal/version.Version=$V"
          STAMP="$STAMP -X github.com/opensave/opensave/internal/version.BuildTime=$(date +%s)"
          # Universal rather than two downloads: a Mac user should not have to
          # know whether their machine is Apple silicon or Intel, and choosing
          # wrong produces an app that simply will not open.
          wails build -platform darwin/universal -ldflags "$STAMP"
          if [ ! -d build/bin/OpenSave.app ]; then
            echo "::error::wails build produced no OpenSave.app"
            exit 1
          fi

      - name: Sign the app (ad hoc)
        working-directory: cmd/opensave-app
        run: |
          APP=build/bin/OpenSave.app
          # Extended attributes left by the build make codesign refuse
          # ("resource fork, Finder information, or similar detritus").
          xattr -cr "$APP"
          # After everything that changes the bundle and before it is copied
          # anywhere: the signature seals the executable, Info.plist and the
          # resources as they are now, and any later change breaks it.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "^(Identifier|Format|Signature|Sealed Resources)"

      - name: Build CLI + relay for both architectures
        run: |
          V="${GITHUB_REF_NAME#v}"
          LD="-s -w -X github.com/opensave/opensave/internal/version.Version=$V"
          LD="$LD -X github.com/opensave/opensave/internal/version.BuildTime=$(date +%s)"
          for arch in arm64 amd64; do
            dir="opensave-macos-$arch"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -ldflags="$LD" -o "$dir/opensave-cli" ./cmd/opensave-cli
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -ldflags="$LD" -o "$dir/opensave-relay" ./cmd/opensave-relay
            # Ad hoc, like the app: Go signs an arm64 binary only as the
            # linker, and an Intel one not at all.
            codesign --force --sign - "$dir/opensave-cli" "$dir/opensave-relay"
            codesign --verify --strict "$dir/opensave-cli" "$dir/opensave-relay"
            cp packaging/man/opensave.1 "$dir/" 2>/dev/null || true
            tar -czf "$dir.tar.gz" "$dir"
          done

      - name: Package the .dmg
        run: |
          # hdiutil ships with macOS, so this needs no third-party action to
          # audit. The staging folder holds the app beside a symlink to
          # /Applications, which is the drag-to-install layout Mac users expect.
          STAGE=dmg-stage
          mkdir -p "$STAGE"
          cp -R cmd/opensave-app/build/bin/OpenSave.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname OpenSave -srcfolder "$STAGE" -ov -format UDZO OpenSave-macos.dmg
          hdiutil verify OpenSave-macos.dmg

          # What a Mac gets is the app inside the image, so check that one:
          # mounted read-only, its signature must still be whole — the
          # "damaged" message is a signature that does not verify.
          MNT="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" OpenSave-macos.dmg
          codesign --verify --deep --strict --verbose=2 "$MNT/OpenSave.app"
          codesign --display --verbose=2 "$MNT/OpenSave.app" 2>&1 | grep -q "Sealed Resources version=2" \
            || { hdiutil detach "$MNT"; echo "::error::the app in the .dmg has no sealed resources — macOS would call it damaged"; exit 1; }
          hdiutil detach "$MNT"

      - name: Check the bundle is what it claims to be
        run: |
          # Structural checks only. The app opens a webview on start and has no
          # --version flag, so running it on a runner with no display would
          # either hang this job or leave a process behind. A build check must
          # not be able to do that.
          APP=cmd/opensave-app/build/bin/OpenSave.app
          BIN="$APP/Contents/MacOS/OpenSave"
          test -f "$APP/Contents/Info.plist" || { echo "::error::the bundle has no Info.plist"; exit 1; }
          test -x "$BIN" || { echo "::error::no executable at $BIN"; exit 1; }
          # Universal or it is not universal: a single-architecture binary means
          # half the Macs that download it cannot open it, and nothing else in
          # this job would notice.
          codesign --verify --deep --strict "$APP" \
            || { echo "::error::the app's signature does not verify — macOS would call it damaged"; exit 1; }
          ARCHS="$(lipo -archs "$BIN")"
          echo "architectures: $ARCHS"
          case "$ARCHS" in
            *arm64*x86_64* | *x86_64*arm64*) ;;
            *) echo "::error::expected a universal binary, got: $ARCHS"; exit 1 ;;
          esac
          # And that the version really was stamped in. An unstamped build
          # reports the default and breaks self-update comparisons silently.
          V="${GITHUB_REF_NAME#v}"
          # grep -a rather than strings: verified locally that it finds an
          # ldflags-injected version in both a Windows and a darwin binary, and
          # reports nothing for a version that was never stamped. strings is not
          # present everywhere, and a check that silently fails open is worse
          # than no check.
          grep -aqF "$V" "$BIN" || echo "::warning::could not find version $V in the binary"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            OpenSave-macos.dmg
            opensave-macos-arm64.tar.gz
            opensave-macos-amd64.tar.gz

  relay-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build relay image
        run: docker build -f relay/Dockerfile -t opensave-relay .

  # Publish a real GitHub Release with all downloadable assets on tag push.
  release:
    needs: [windows, linux, flatpak, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: flatpak
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos
      # GitHub renames release assets: a "~" in a filename becomes ".". The
      # Debian and RPM packages spell a pre-release as 2.4.0~beta.1, so the
      # names in SHA256SUMS did not match the names on the releases page for
      # any beta, and a checksum nobody can look up verifies nothing. Rename
      # them here to what GitHub will publish, before the sums are taken.
      - name: Name packages the way GitHub will publish them
        run: |
          for f in linux/*~*; do
            [ -e "$f" ] || continue
            mv -v "$f" "$(echo "$f" | tr '~' '.')"
          done

      # The Windows artifact is uploaded from two folders, and upload-artifact
      # keeps each file's path relative to their common root — so they arrive
      # as windows/cmd/opensave-app/build/bin/OpenSave.exe and
      # windows/dist/opensave-cli.exe, not windows/OpenSave.exe. The publish
      # step's windows/**/*.exe and the path-stripping in SHA256SUMS both
      # tolerated that; the check below did not, and refused the first real
      # release it ran on with every Windows file "missing". Flatten first,
      # so one layout is what everything after this sees.
      - name: Flatten the Windows artifact
        run: |
          find windows -mindepth 2 -type f -name '*.exe' -exec mv -v -t windows/ {} +
          ls -la windows/

      # Every platform's build has to be here, or this is not a release of
      # OpenSave — it is a release of some of it. The macOS job built,
      # verified and uploaded a .dmg and two tarballs for a month before
      # anyone noticed the publish step below never listed them, and
      # fail_on_unmatched_files is (necessarily) off. install.sh on a Mac
      # downloads one of those tarballs. Checked by name, loudly.
      - name: Check every artifact is present
        run: |
          missing=0
          for want in \
            windows/OpenSave.exe windows/OpenSave.Setup.exe \
            windows/opensave-cli.exe windows/opensave-relay.exe \
            linux/opensave-linux-amd64.tar.gz linux/opensave-linux-arm64.tar.gz \
            linux/OpenSave-decky-plugin.zip \
            flatpak/OpenSave.flatpak \
            macos/OpenSave-macos.dmg \
            macos/opensave-macos-amd64.tar.gz macos/opensave-macos-arm64.tar.gz; do
            if [ ! -f "$want" ]; then
              echo "::error::release artifact missing: $want"
              missing=1
            fi
          done
          ls linux/*.deb linux/*.rpm >/dev/null 2>&1 || { echo "::error::no .deb/.rpm in linux/"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to publish a partial release"
            exit 1
          fi

      # scripts/install.sh verifies downloads against this before installing.
      # Piping an installer to a shell is trust enough; it should at least
      # refuse bytes it can't vouch for.
      - name: Generate SHA256SUMS
        run: |
          find windows linux flatpak macos -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.tar.gz' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \
               -o -name '*.zip' -o -name '*.dmg' \) \
            -exec sha256sum {} + | sed 's| .*/| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenSave ${{ github.ref_name }}
          # Hyphenated tags (v2.1.0-beta.1) publish as pre-releases, so
          # /releases/latest ignores them. Only devices on the beta channel
          # are offered these: either the user ticked Settings -> Updates, or
          # they are already running a pre-release (see selfupdate).
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Note: re-publishing the same tag appends another generated-notes
          # block; if a tag is ever re-cut, tidy the release body by hand.
          generate_release_notes: true
          # `body` is placed above the generated notes, so the invitation is
          # the first thing in every release rather than buried under a
          # commit list.
          body: |
            ### 💬 Questions, bug reports, or just want to say hello?

            **[Join the OpenSave Discord →](https://discord.gg/hvBv92DZvn)**

            It is the fastest way to get help, and where new builds get
            discussed before they ship.

            ---
          fail_on_unmatched_files: false
          files: |
            windows/**/*.exe
            linux/*.tar.gz
            linux/*.deb
            linux/*.rpm
            linux/OpenSave-decky-plugin.zip
            flatpak/*.flatpak
            macos/*.dmg
            macos/*.tar.gz
            SHA256SUMS
